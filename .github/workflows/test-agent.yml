name: Agent checks
on:
  push:
    paths: ['neuroquantum_agent.py', 'neuroquantum_search.py', 'handler.py', 'runpod_handler.py', 'tests/test_neuroquantum_agent.py', '.github/workflows/test-agent.yml']
  pull_request:
    paths: ['neuroquantum_agent.py', 'neuroquantum_search.py', 'handler.py', 'runpod_handler.py', 'tests/test_neuroquantum_agent.py', '.github/workflows/test-agent.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest requests
      - run: python -m pytest -q tests/test_neuroquantum_agent.py
