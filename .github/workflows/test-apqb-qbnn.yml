name: Test APQB, QBNN, and NeuroQuantum

on:
  push:
    branches: [main, develop]
    paths:
      - "apqb_qbnn_v2.py"
      - "test_apqb_qbnn_v2.py"
      - "tests/test_apqb_qbnn_regressions.py"
      - "neuroquantum_layered.py"
      - "neuroquantum_search.py"
      - "qbnn_layered.py"
      - "train_hf_dataset.py"
      - "tests/test_neuroquantum*.py"
      - "scripts/*neuroquantum*"
      - "requirements-runpod.txt"
      - ".github/workflows/test-apqb-qbnn.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apqb_qbnn_v2.py"
      - "test_apqb_qbnn_v2.py"
      - "tests/test_apqb_qbnn_regressions.py"
      - "neuroquantum_layered.py"
      - "neuroquantum_search.py"
      - "qbnn_layered.py"
      - "train_hf_dataset.py"
      - "tests/test_neuroquantum*.py"
      - "scripts/*neuroquantum*"
      - "requirements-runpod.txt"
      - ".github/workflows/test-apqb-qbnn.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest requests
      - name: Test QBNN math, NeuroQuantum attention, and microbatch training
        run: >-
          python -m pytest -q test_apqb_qbnn_v2.py tests/test_apqb_qbnn_regressions.py
          tests/test_neuroquantum_regressions.py tests/test_neuroquantum_training.py
          tests/test_neuroquantum_search.py
      - name: Check Runpod entry points
        run: |
          bash -n scripts/train_neuroquantum_runpod.sh
          bash scripts/train_neuroquantum_runpod.sh --help
