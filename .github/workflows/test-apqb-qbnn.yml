name: Test APQB and QBNN v2

on:
  push:
    branches: [main, develop]
    paths:
      - "apqb_qbnn_v2.py"
      - "test_apqb_qbnn_v2.py"
      - "tests/test_apqb_qbnn_regressions.py"
      - ".github/workflows/test-apqb-qbnn.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apqb_qbnn_v2.py"
      - "test_apqb_qbnn_v2.py"
      - "tests/test_apqb_qbnn_regressions.py"
      - ".github/workflows/test-apqb-qbnn.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest
      - name: Test APQB math and QBNN training
        run: python -m pytest -q test_apqb_qbnn_v2.py tests/test_apqb_qbnn_regressions.py
